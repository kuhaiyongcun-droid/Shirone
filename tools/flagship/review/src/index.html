<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#070b0f">
  <title>kuhai · {{Title}}</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main id="experience" aria-labelledby="room-title">
    <img id="poster" class="poster" src="./assets/overview.webp" alt="{{PosterAlt}}" fetchpriority="high">
    <div id="viewport" tabindex="0" role="region" aria-label="{{Title}}" aria-describedby="keyboard-help"></div>
    <div class="vignette" aria-hidden="true"></div>
    <header class="masthead">
      <a class="identity" href="#" id="home" aria-label="kuhai · {{Title}}"><span class="mark" aria-hidden="true">k.</span><span>kuhai</span></a>
      <span class="study" data-copy="Badge">{{Badge}}</span>
      <div class="header-actions">
        <button id="language" type="button" aria-label="{{Language}}">EN</button>
        <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings" aria-label="{{Settings}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 7h6m4 0h6M4 17h10m4 0h2"/><circle cx="12" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></svg>
        </button>
      </div>
    </header>
    <section id="settings" class="settings" aria-label="{{Settings}}" hidden>
      <label for="quality" data-copy="Quality">{{Quality}}</label>
      <select id="quality">
        <option value="auto" data-copy="Auto">{{Auto}}</option>
        <option value="standard" data-copy="Standard">{{Standard}}</option>
        <option value="light" data-copy="Light">{{Light}}</option>
        <option value="static" data-copy="Static">{{Static}}</option>
      </select>
      <button id="reset" type="button" data-copy="Reset">{{Reset}}</button>
      <p id="keyboard-help" data-copy="KeyboardHelp">{{KeyboardHelp}}</p>
    </section>
    <button id="hotspot" type="button" aria-label="{{Select}}" aria-expanded="false" hidden>
      <span class="beacon" aria-hidden="true"></span><span class="hotspot-label" data-copy="Archive">{{Archive}}</span>
    </button>
    <footer class="footer">
      <div class="intro">
        <p class="eyebrow" id="eyebrow">KUHAI / 01</p>
        <h1 id="room-title" tabindex="-1" data-copy="Title">{{Title}}</h1>
        <p id="description" data-copy="Subtitle">{{Subtitle}}</p>
      </div>
      <div class="journey">
        <button id="enter" class="entry" type="button"><span data-copy="Archive">{{Archive}}</span><span aria-hidden="true">↗</span></button>
        <button id="back" class="entry" type="button" hidden><span aria-hidden="true">↙</span><span data-copy="Back">{{Back}}</span></button>
        <p id="hint" data-copy="DesktopHint">{{DesktopHint}}</p>
      </div>
    </footer>
    <p id="status" role="status" aria-live="polite"></p>
    <noscript><style>#viewport,#hotspot,#settings-toggle,#language,#enter,#hint{display:none}</style><p class="no-script">{{RoomStudy}}</p></noscript>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
