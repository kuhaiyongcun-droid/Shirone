# Include inside the serving HTTP or HTTPS server, after the cache maps exist.
root /srv/kuhai/current;
index index.html;
autoindex off;
server_tokens off;
etag on;
open_file_cache off;
include /etc/nginx/kuhai/mime.types;
default_type application/octet-stream;

add_header Cache-Control $kuhai_cache_control always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css text/javascript application/javascript application/json application/ld+json application/xml application/rss+xml application/atom+xml application/manifest+json image/svg+xml model/gltf+json;

# Successful file fallback keeps the original error status; never use =200.
error_page 404 /404.html;
location = /404.html {
    internal;
    try_files $uri =404;
}
location = /blog/404.html {
    return 404;
}

include /etc/nginx/kuhai/acme.conf;

# Do not expose hidden paths. The root .well-known directory is permitted,
# but a nested .env/.git or source/map file is still denied by later checks.
location ~ "^/(?:\.(?!well-known(?:/|$))|.+/\.)" {
    return 404;
}
location ~* ^/(?:blog/)?(?:src|node_modules|deployment|evidence|scripts|content|runtime)(?:/|$) {
    return 404;
}
location ~* /(?:site\.json|package(?:-lock)?\.json|tsconfig(?:\.[^/]+)?\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?|Dockerfile|Makefile)(?:\.(?:gz|br))?$ {
    return 404;
}
location ~* \.(?:map|ts|tsx|jsx|astro|vue|svelte|md|mdx|py|pyc|sh|ps1|bat|cmd|blend[0-9]*|pem|key|env|ini|toml|ya?ml|lock|bak|log|sql)(?:\.(?:gz|br))?$ {
    return 404;
}

# security.txt, assetlinks.json and other intentionally published files work.
location /.well-known/ {
    try_files $uri =404;
}
location = /blog {
    return 308 /blog/$is_args$args;
}
location / {
    try_files $uri $uri/ =404;
}
