# TEMPLATE: replace both certificate placeholders with real absolute paths.
# Do not activate before nginx -t can open the actual certificate and key.
server {
    listen 80;
    server_name kuhaiyongcun.com;
    server_tokens off;
    add_header Cache-Control no-store always;
    include /etc/nginx/kuhai/acme.conf;
    location / {
        return 308 https://kuhaiyongcun.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name kuhaiyongcun.com;
    ssl_certificate /REPLACE_WITH_ACTUAL_CERTIFICATE/fullchain.pem;
    ssl_certificate_key /REPLACE_WITH_ACTUAL_CERTIFICATE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KUHAI_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/kuhai/site.conf;
}
