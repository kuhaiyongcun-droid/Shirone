# Install once as /etc/nginx/conf.d/00-kuhai-cache.conf inside the http context.
# Only names generated with a content hash receive immutable caching.
map $uri $kuhai_asset_cache {
    default "no-cache";
    "~*\.[0-9a-f]{8,64}\.(?:css|js|mjs|png|jpe?g|webp|avif|gif|svg|ico|woff2?|ttf|otf|wasm|glb|bin)$" "public, max-age=31536000, immutable";
    "~^/(?:blog/)?_astro/[^/]+\.[A-Za-z0-9_-]{8,}\.(?:css|js|mjs|png|jpe?g|webp|avif|gif|svg|woff2?|ttf|otf|wasm)$" "public, max-age=31536000, immutable";
    "~*\.(?:css|js|mjs|png|jpe?g|webp|avif|gif|svg|ico|woff2?|ttf|otf|eot|wasm|glb|gltf|bin|mp4|webm|mp3|ogg|wav|pdf)$" "public, max-age=3600";
}

# Missing hashed files and error responses must not receive a one-year TTL.
map $status $kuhai_cache_control {
    default "no-store";
    200 $kuhai_asset_cache;
    206 $kuhai_asset_cache;
    304 $kuhai_asset_cache;
}
